name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC,           os: ubuntu-latest,  cmake_args: "" }
          - { name: Linux Clang shared,  os: ubuntu-latest,  cmake_args: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCHDMODERN_SHARED=ON" }
          - { name: Linux no threads,    os: ubuntu-latest,  cmake_args: "-DCHDMODERN_NO_THREADS=ON" }
          - { name: macOS,               os: macos-latest,   cmake_args: "" }
          - { name: Windows MSVC x64,    os: windows-latest, cmake_args: "-A x64" }
          - { name: Windows MSVC ARM64,  os: windows-latest, cmake_args: "-A ARM64", cross: true }
          - { name: Android arm64,       os: ubuntu-latest,  cross: true, android: true }

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        if: ${{ !matrix.android }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Configure (Android)
        if: ${{ matrix.android }}
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        if: ${{ !matrix.cross }}
        run: ctest --test-dir build -C Release --output-on-failure

  msbuild:
    name: Visual Studio solution ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild msvc\CHDmodern.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }}
      - name: Test
        if: ${{ matrix.platform != 'ARM64' }}
        shell: pwsh
        run: |
          $plat = if ('${{ matrix.platform }}' -eq 'x86') { 'Win32' } else { '${{ matrix.platform }}' }
          & "build\msvc\$plat\Release\chdm-selftest.exe" $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  msvc-projects-up-to-date:
    name: Generated VS projects are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/gen-msvc.py && git diff --exit-code msvc
