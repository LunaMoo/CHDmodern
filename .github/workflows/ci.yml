name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC,           os: ubuntu-latest,  cmake_args: "" }
          - { name: Linux Clang shared,  os: ubuntu-latest,  cmake_args: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCHDMODERN_SHARED=ON" }
          - { name: Linux no threads,    os: ubuntu-latest,  cmake_args: "-DCHDMODERN_NO_THREADS=ON" }
          - { name: macOS,               os: macos-latest,   cmake_args: "" }
          - { name: Windows MSVC x64,    os: windows-latest, cmake_args: "-A x64" }
          - { name: Windows MSVC x64 DLL, os: windows-latest, cmake_args: "-A x64 -DCHDMODERN_SHARED=ON" }
          - { name: Windows MSVC ARM64,  os: windows-latest, cmake_args: "-A ARM64", cross: true }
          - { name: macOS universal shared, os: macos-latest, cmake_args: "'-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCHDMODERN_SHARED=ON" }

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        if: ${{ !matrix.cross }}
        run: ctest --test-dir build -C Release --output-on-failure

  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-21
          -DCHDMODERN_SHARED=ON -DCHDMODERN_BUILD_TOOLS=OFF -DCHDMODERN_BUILD_TESTS=OFF
      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build build --parallel 2>&1 | tee build.log; then
            grep -E "error|fatal|undefined" build.log | sort -u | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - name: Check exports
        run: |
          test -f build/CHDm.so
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf --dyn-syms build/CHDm.so | grep -q chdm_version
      - uses: actions/upload-artifact@v4
        with:
          name: CHDm-android-${{ matrix.abi }}
          path: build/CHDm.so

  ios:
    name: iOS arm64 ${{ matrix.shared == 'ON' && 'shared' || 'static' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shared: [ON, OFF]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DCHDMODERN_SHARED=${{ matrix.shared }} -DCHDMODERN_BUILD_TOOLS=OFF -DCHDMODERN_BUILD_TESTS=OFF
      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build build --parallel 2>&1 | tee build.log; then
            grep -E "error|fatal|undefined" build.log | sort -u | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - name: Check
        run: |
          f=build/CHDm.$([ "${{ matrix.shared }}" = ON ] && echo dylib || echo a)
          test -f $f
          if [ "${{ matrix.shared }}" = ON ]; then
            otool -l $f | grep -A4 LC_BUILD_VERSION | grep -q "platform 2"
            nm -gU $f | grep -q _chdm_version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CHDm-ios-arm64-${{ matrix.shared == 'ON' && 'shared' || 'static' }}
          path: build/CHDm.*

  msbuild:
    name: Visual Studio solution ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild msvc\CHDmodern.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }}
      - name: Test
        if: ${{ matrix.platform != 'ARM64' }}
        shell: pwsh
        run: |
          $plat = if ('${{ matrix.platform }}' -eq 'x86') { 'Win32' } else { '${{ matrix.platform }}' }
          $out = & "build\msvc\$plat\Release\chdm-selftest.exe" $env:RUNNER_TEMP 2>&1
          $out
          if ($LASTEXITCODE -ne 0) { $out | Select-String "FAIL" | Select-Object -First 15 | ForEach-Object { "::error::selftest: $_" }; exit $LASTEXITCODE }
          $out = & "build\msvc\$plat\Release\dll\chdm-dlltest.exe" tests\data\sample_dvd_zlib.chd 2>&1
          $out
          if ($LASTEXITCODE -ne 0) { $out | Select-Object -Last 10 | ForEach-Object { "::error::dlltest: $_" }; exit $LASTEXITCODE }

  msvc-projects-up-to-date:
    name: Generated VS projects are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/gen-msvc.py && git diff --exit-code msvc
